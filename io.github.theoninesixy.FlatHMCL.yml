app-id: io.github.theoninesixy.FlatHMCL
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: hmcl

sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21

finish-args:
  - --require-version=1.16.0
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre
  - --env=GDK_BACKEND=x11
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=~/.minecraft:create
  - --device=input
  - --filesystem=/run/udev:ro

modules:
  - name: openjdk-runtimes
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/jvm/openjdk-21
      - cp -ra /usr/lib/sdk/openjdk21/jvm/openjdk-21/* /app/lib/jvm/openjdk-21/
      - rm -rf /app/lib/jvm/openjdk-21/{include,demo,man,legal,lib/src.zip,jmods}
      - ln -s /app/lib/jvm/openjdk-21 /app/jre

  - name: hmcl
    buildsystem: simple
    build-commands:
      - install -Dm755 run.sh /app/bin/hmcl
      - install -Dm644 HMCL.jar /app/share/hmcl/HMCL.jar
      - install -Dm644 io.github.theoninesixy.FlatHMCL.desktop /app/share/applications/io.github.theoninesixy.FlatHMCL.desktop
      - install -Dm644 io.github.theoninesixy.FlatHMCL.metainfo.xml /app/share/metainfo/io.github.theoninesixy.FlatHMCL.metainfo.xml
      - install -Dm644 io.github.theoninesixy.FlatHMCL.png /app/share/icons/hicolor/256x256/apps/io.github.theoninesixy.FlatHMCL.png
    sources:
      - type: file
        url: https://github.com/HMCL-dev/HMCL/releases/download/v3.15.1/HMCL-3.15.1.jar
        sha256: 52feb0dd71324a8aac2829995668839067e67ab7ad1dfbe9c05998309cf49afe
        dest-filename: HMCL.jar
        x-checker-data:
          type: json
          url: https://api.github.com/repos/HMCL-dev/HMCL/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | test("^HMCL-.*\\.jar$")) | .browser_download_url
      - type: file
        path: run.sh
      - type: file
        path: io.github.theoninesixy.FlatHMCL.desktop
      - type: file
        path: io.github.theoninesixy.FlatHMCL.metainfo.xml
      - type: file
        path: io.github.theoninesixy.FlatHMCL.png