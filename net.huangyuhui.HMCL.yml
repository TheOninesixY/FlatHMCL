app-id: net.huangyuhui.HMCL
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: hmcl

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-data/minecraft:create
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=~/.minecraft:create
  - --allow=devel

modules:
  - name: hmcl
    buildsystem: simple
    build-commands:
      - install -Dm755 hmcl.sh /app/bin/hmcl-bin
      - install -Dm755 hmcl-wrapper.sh /app/bin/hmcl
      - install -Dm644 net.huangyuhui.HMCL.desktop /app/share/applications/net.huangyuhui.HMCL.desktop
      - install -Dm644 net.huangyuhui.HMCL.metainfo.xml /app/share/metainfo/net.huangyuhui.HMCL.metainfo.xml
      - install -Dm644 net.huangyuhui.HMCL.svg /app/share/icons/hicolor/scalable/apps/net.huangyuhui.HMCL.svg
    sources:
      - type: file
        url: https://github.com/HMCL-dev/HMCL/releases/download/v3.13.2/HMCL-3.13.2.sh
        sha256: PLACEHOLDER_SHA256_HASH
        dest-filename: hmcl.sh
        x-checker-data:
          type: json
          url: https://api.github.com/repos/HMCL-dev/HMCL/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: .assets[] | select(.name | endswith(".sh")) | .browser_download_url

      - type: file
        path: hmcl-wrapper.sh

      - type: file
        path: net.huangyuhui.HMCL.desktop

      - type: file
        path: net.huangyuhui.HMCL.metainfo.xml

      - type: file
        path: net.huangyuhui.HMCL.svg