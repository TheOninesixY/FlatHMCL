app-id: io.github.theoninesixy.FlatHMCL
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: hmcl

sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21

finish-args:
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre
  - --env=GDK_BACKEND=x11
  - --socket=x11
  - --socket=wayland
  - --share=ipc
  - --device=dri
  - --share=network
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.secrets
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=~/.minecraft:create
  - --device=input
  - --filesystem=/run/udev:ro

modules:
  - name: jq
    buildsystem: simple
    build-commands:
      - install -Dm755 jq /app/bin/jq
    sources:
      - type: file
        url: https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux64
        sha256: 5942c9b0934e510ee61eb3e30273f1b3fe2590df93933a93d7c58b81d19c8ff5
        dest-filename: jq
        only-arches:
          - x86_64
      - type: file
        url: https://github.com/jqlang/jq/releases/download/jq-1.7.1/jq-linux-arm64
        sha256: 39a486333932766dc822d56a31c039ab610a7114d69bcba23a3d5e2a233b8253
        dest-filename: jq
        only-arches:
          - aarch64

  - name: openjdk-runtimes
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/jvm/openjdk-21
      - cp -ra /usr/lib/sdk/openjdk21/jvm/openjdk-21/* /app/lib/jvm/openjdk-21/
      - rm -rf /app/lib/jvm/openjdk-21/{include,demo,man,legal,lib/src.zip,jmods}
      - ln -s /app/lib/jvm/openjdk-21 /app/jre

  - name: hmcl-build
    buildsystem: simple
    build-commands:
      - install -Dm755 run.sh /app/bin/hmcl
      - install -Dm644 io.github.theoninesixy.FlatHMCL.desktop /app/share/applications/io.github.theoninesixy.FlatHMCL.desktop
      - install -Dm644 io.github.theoninesixy.FlatHMCL.metainfo.xml /app/share/metainfo/io.github.theoninesixy.FlatHMCL.metainfo.xml
      - install -Dm644 io.github.theoninesixy.FlatHMCL.png /app/share/icons/hicolor/256x256/apps/io.github.theoninesixy.FlatHMCL.png
      - mkdir -p /app/share/hmcl
      - cp -ra bin /app/share/hmcl/
    sources:
      - type: file
        path: run.sh
      - type: file
        path: io.github.theoninesixy.FlatHMCL.desktop
      - type: file
        path: io.github.theoninesixy.FlatHMCL.metainfo.xml
      - type: file
        path: io.github.theoninesixy.FlatHMCL.png
      - type: dir
        path: bin
        dest: bin