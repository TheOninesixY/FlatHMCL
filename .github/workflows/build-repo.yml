name: Build and Deploy Flatpak Repo

on:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream HMCL release
        run: |
          echo "[INFO] Checking upstream HMCL releases..."
          RELEASE_DATA=$(curl -sL -H "User-Agent: FlatHMCL-Sync-Bot" https://api.github.com/repos/HMCL-dev/HMCL/releases/latest || true)
          LATEST_TAG=$(echo "$RELEASE_DATA" | jq -r '.tag_name // empty')
          JAR_URL=$(echo "$RELEASE_DATA" | jq -r '.assets[]? | select(.name | test("^HMCL-.*\\.jar$")) | .browser_download_url // empty' | head -n 1)

          if [ -z "$LATEST_TAG" ] || [ -z "$JAR_URL" ]; then
            echo "[WARN] Could not fetch latest release from GitHub API. Proceeding with current manifest."
            exit 0
          fi

          VERSION="${LATEST_TAG#v}"
          echo "[INFO] Upstream latest version: $VERSION"

          CURRENT_URL=$(grep -E 'https://github.com/HMCL-dev/HMCL/releases/download/' io.github.theoninesixy.FlatHMCL.yml | awk '{print $2}' | tr -d '"' | tr -d "'" || true)

          if [ "$CURRENT_URL" != "$JAR_URL" ]; then
            echo "[INFO] New upstream release detected ($VERSION). Downloading JAR to verify SHA256..."
            curl -sL "$JAR_URL" -o /tmp/HMCL-latest.jar
            JAR_SHA256=$(sha256sum /tmp/HMCL-latest.jar | awk '{print $1}')
            rm -f /tmp/HMCL-latest.jar

            echo "[INFO] Updating manifest with URL and SHA256..."
            sed -i -E "s|url: https://github.com/HMCL-dev/HMCL/releases/download/[^ ]+|url: $JAR_URL|g" io.github.theoninesixy.FlatHMCL.yml
            sed -i -E "s|sha256: [a-f0-9]{64}|sha256: $JAR_SHA256|g" io.github.theoninesixy.FlatHMCL.yml

            RELEASE_DATE=$(date -u +'%Y-%m-%d')
            sed -i -E "s|<release version=\"[^\"]+\" date=\"[^\"]+\">|<release version=\"$VERSION\" date=\"$RELEASE_DATE\">|g" io.github.theoninesixy.FlatHMCL.metainfo.xml
            sed -i -E "s|<p>同步 HMCL 上游官方版本 [^<]+ 发布。<\/p>|<p>同步 HMCL 上游官方版本 $VERSION 发布。<\/p>|g" io.github.theoninesixy.FlatHMCL.metainfo.xml

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add io.github.theoninesixy.FlatHMCL.yml io.github.theoninesixy.FlatHMCL.metainfo.xml
            git commit -m "[AUTO] Sync upstream HMCL to $LATEST_TAG" || true
            git push origin main || true
            echo "[INFO] Repository metadata successfully synced to version $VERSION."
          else
            echo "[INFO] Manifest is already up to date with upstream version $VERSION."
          fi

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "[INFO] Importing GPG private key..."
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep -E "sec\s" | awk '{print $2}' | cut -d'/' -f2 | head -n 1)
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"

      - name: Build Flatpak and Export to OSTree Repo
        run: |
          echo "[INFO] Initializing system dbus machine-id..."
          dbus-uuidgen --ensure 2>/dev/null || true

          echo "[INFO] Installing runtime dependencies..."
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

          echo "[INFO] Building package and committing to repo..."
          flatpak-builder \
            --user \
            --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --gpg-sign="${GPG_KEY_ID}" \
            --repo=repo \
            --force-clean \
            build-dir \
            io.github.theoninesixy.FlatHMCL.yml

          echo "[INFO] Updating repo summary and static deltas..."
          flatpak build-update-repo \
            --gpg-sign="${GPG_KEY_ID}" \
            --generate-static-deltas \
            --prune \
            repo

          echo "[INFO] Building standalone bundle..."
          flatpak build-bundle \
            --gpg-sign="${GPG_KEY_ID}" \
            repo \
            FlatHMCL.flatpak \
            io.github.theoninesixy.FlatHMCL

      - name: Prepare Web and Distribution Assets
        run: |
          mkdir -p dist
          cp -ra repo dist/
          cp -f FlatHMCL.flatpak dist/
          cp -f index.html dist/
          cp -f io.github.theoninesixy.FlatHMCL.flatpakref dist/
          cp -f io.github.theoninesixy.FlatHMCL.png dist/
          cp -f screenshot.png dist/ 2>/dev/null || true
          cp -f flathmcl-gpg-public.asc dist/ 2>/dev/null || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlatHMCL-bundle
          path: FlatHMCL.flatpak

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4