name: Check HMCL Update

on:
  schedule:
    # 每天 UTC 16:00 运行（对应北京时间每日 00:00）
    - cron: '0 16 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动触发执行

permissions:
  contents: write
  pull-requests: write

permissions:
  contents: write
  pull-requests: write

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest HMCL release
        id: get_release
        run: |
          # 请求 GitHub API 获取最新 Release 信息
          RELEASE_JSON=$(curl -sL https://api.github.com/repos/HMCL-dev/HMCL/releases/latest)
          
          # 获取 .jar 文件的完整下载链接
          DOWNLOAD_URL=$(echo "$RELEASE_JSON" | jq -r '.assets[] | select(.name | endswith(".jar")) | .browser_download_url' | head -n 1)
          
          # 从文件名提取版本号
          FILE_NAME=$(basename "$DOWNLOAD_URL")
          EXTRACTED_VERSION=$(echo "$FILE_NAME" | sed -E 's/HMCL-(.*)\.jar/\1/')

          if [ -z "$DOWNLOAD_URL" ] || [ -z "$EXTRACTED_VERSION" ]; then
            echo "Error: Failed to fetch download URL or extract version."
            exit 1
          fi

          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT
          echo "extracted_version=$EXTRACTED_VERSION" >> $GITHUB_OUTPUT

      - name: Download jar and calculate SHA256
        id: calc_sha
        run: |
          curl -sL "${{ steps.get_release.outputs.download_url }}" -o HMCL.jar
          SHA256=$(sha256sum HMCL.jar | awk '{print $1}')
          echo "sha256=$SHA256" >> $GITHUB_OUTPUT

      - name: Update manifest and metainfo
        id: update_files
        run: |
          MANIFEST="io.github.theoninesixy.FlatHMCL.yml"
          METAINFO="io.github.theoninesixy.FlatHMCL.metainfo.xml"
          
          NEW_URL="${{ steps.get_release.outputs.download_url }}"
          NEW_SHA="${{ steps.calc_sha.outputs.sha256 }}"
          NEW_VERSION="${{ steps.get_release.outputs.extracted_version }}"

          # 读取 YML 文件中当前的 SHA256 进行比对
          OLD_SHA=$(grep -A 2 'dest-filename: HMCL.jar' "$MANIFEST" | grep 'sha256:' | awk '{print $2}' || true)

          if [ "$OLD_SHA" == "$NEW_SHA" ]; then
            echo "Already up to date. Skipping commit."
            echo "updated=false" >> $GITHUB_OUTPUT
          else
            # 1. 更新 YML 中的下载链接与 SHA256 校验码
            sed -i -E "s|url: https://github.com/HMCL-dev/HMCL/releases/download/.*|url: $NEW_URL|" "$MANIFEST"
            sed -i -E "s|sha256: [a-fA-F0-9]{64}|sha256: $NEW_SHA|" "$MANIFEST"

            # 2. 更新 metainfo.xml 中的版本号与当前日期 (YYYY-MM-DD)
            TODAY=$(date -u +%Y-%m-%d)
            sed -i -E "s/<release version=\"[^\"]*\" date=\"[^\"]*\">/<release version=\"$NEW_VERSION\" date=\"$TODAY\">/" "$METAINFO"

            echo "updated=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.update_files.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update HMCL to v${{ steps.get_release.outputs.extracted_version }}"
          title: "Update HMCL to ${{ steps.get_release.outputs.extracted_version }}"
          body: |
            Automated HMCL update.
            - **Version**: `${{ steps.get_release.outputs.extracted_version }}`
            - **Download URL**: `${{ steps.get_release.outputs.download_url }}`
            - **SHA256**: `${{ steps.calc_sha.outputs.sha256 }}`
          branch: "update/hmcl-${{ steps.get_release.outputs.extracted_version }}"
          delete-branch: true