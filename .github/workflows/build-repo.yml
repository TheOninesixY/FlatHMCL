name: Build and Deploy Flatpak Repo

on:
  push:
    branches:
      - main
    paths:
      - 'io.github.theoninesixy.FlatHMCL.yml'
      - 'io.github.theoninesixy.FlatHMCL.desktop'
      - 'io.github.theoninesixy.FlatHMCL.metainfo.xml'
      - 'run.sh'
      - 'bin/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "[INFO] Importing GPG private key..."
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep -E "sec\s" | awk '{print $2}' | cut -d'/' -f2 | head -n 1)
          echo "GPG_KEY_ID=$GPG_KEY_ID" >> "$GITHUB_ENV"

      - name: Build Flatpak and Export to OSTree Repo
        run: |
          echo "[INFO] Initializing system dbus machine-id..."
          dbus-uuidgen --ensure 2>/dev/null || true

          echo "[INFO] Installing runtime dependencies..."
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo

          echo "[INFO] Building package and committing to repo..."
          flatpak-builder \
            --user \
            --disable-rofiles-fuse \
            --install-deps-from=flathub \
            --gpg-sign="${GPG_KEY_ID}" \
            --repo=repo \
            --force-clean \
            build-dir \
            io.github.theoninesixy.FlatHMCL.yml

          echo "[INFO] Updating repo summary and static deltas..."
          flatpak build-update-repo \
            --gpg-sign="${GPG_KEY_ID}" \
            --generate-static-deltas \
            --prune \
            repo

          echo "[INFO] Building standalone bundle..."
          flatpak build-bundle \
            --gpg-sign="${GPG_KEY_ID}" \
            repo \
            FlatHMCL.flatpak \
            io.github.theoninesixy.FlatHMCL

      - name: Prepare Web and Distribution Assets
        run: |
          mkdir -p dist
          cp -ra repo dist/
          cp -f FlatHMCL.flatpak dist/
          cp -f index.html dist/
          cp -f io.github.theoninesixy.FlatHMCL.flatpakref dist/
          cp -f io.github.theoninesixy.FlatHMCL.png dist/
          cp -f screenshot.png dist/ 2>/dev/null || true
          cp -f flathmcl-gpg-public.asc dist/ 2>/dev/null || true

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Upload Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlatHMCL-bundle
          path: FlatHMCL.flatpak

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4