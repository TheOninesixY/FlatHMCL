name: Check and Update Upstream HMCL

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream HMCL release
        run: |
          echo "[INFO] Querying upstream release metadata..."
          RELEASE_DATA=$(curl -sL -H "Accept: application/vnd.github+json" -H "User-Agent: FlatHMCL-Sync-Bot" https://api.github.com/repos/HMCL-dev/HMCL/releases/latest)
          
          LATEST_TAG=$(echo "$RELEASE_DATA" | jq -r '.tag_name // empty')
          JAR_ASSET=$(echo "$RELEASE_DATA" | jq -c '.assets[] | select(.name | test("^HMCL-.*\\.jar$"))' | head -n 1)
          
          if [ -z "$LATEST_TAG" ] || [ -z "$JAR_ASSET" ]; then
            echo "[ERROR] Failed to parse upstream release asset from GitHub API." >&2
            exit 1
          fi

          VERSION="${LATEST_TAG#v}"
          JAR_URL=$(echo "$JAR_ASSET" | jq -r '.browser_download_url')
          JAR_DIGEST=$(echo "$JAR_ASSET" | jq -r '.digest // empty')
          JAR_SHA256="${JAR_DIGEST#sha256:}"

          if [ -z "$JAR_SHA256" ] || [ "$JAR_SHA256" = "null" ]; then
            echo "[ERROR] SHA256 digest is unavailable in release metadata." >&2
            exit 1
          fi

          echo "[INFO] Upstream version: $VERSION"
          echo "[INFO] Asset URL: $JAR_URL"
          echo "[INFO] Asset SHA256: $JAR_SHA256"

          sed -i -E "s|url: https://github.com/HMCL-dev/HMCL/releases/download/[^ ]+|url: $JAR_URL|g" io.github.theoninesixy.FlatHMCL.yml
          sed -i -E "s|sha256: [a-f0-9]{64}|sha256: $JAR_SHA256|g" io.github.theoninesixy.FlatHMCL.yml

          RELEASE_DATE=$(date -u +'%Y-%m-%d')
          sed -i -E "s|<release version=\"[^\"]+\" date=\"[^\"]+\">|<release version=\"$VERSION\" date=\"$RELEASE_DATE\">|g" io.github.theoninesixy.FlatHMCL.metainfo.xml
          sed -i -E "s|<p>同步 HMCL 上游官方版本 [^<]+ 发布。<\/p>|<p>同步 HMCL 上游官方版本 $VERSION 发布。<\/p>|g" io.github.theoninesixy.FlatHMCL.metainfo.xml

          if git diff --quiet io.github.theoninesixy.FlatHMCL.yml io.github.theoninesixy.FlatHMCL.metainfo.xml; then
            echo "[INFO] No changes detected. All files are up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add io.github.theoninesixy.FlatHMCL.yml io.github.theoninesixy.FlatHMCL.metainfo.xml
            git commit -m "[AUTO] Sync upstream HMCL to $LATEST_TAG"
            git push origin main
            echo "[INFO] Successfully committed and pushed updates."
          fi