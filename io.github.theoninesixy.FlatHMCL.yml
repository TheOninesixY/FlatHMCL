app-id: io.github.theoninesixy.FlatHMCL
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: hmcl

sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk21

finish-args:
  - --env=PATH=/app/jre/bin:/app/bin:/usr/bin
  - --env=JAVA_HOME=/app/jre
  - --socket=x11
  - --share=ipc
  - --device=dri
  - --device=all
  - --share=network
  - --socket=pulseaudio
  - --talk-name=org.freedesktop.Notifications
  - --filesystem=xdg-documents
  - --filesystem=xdg-download
  - --filesystem=~/.minecraft:create
  - --filesystem=~/.hmcl:create
  - --allow=devel

modules:
  - name: openjdk
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk21/install.sh

  - name: hmcl-build
    buildsystem: simple
    build-commands:
      - install -Dm755 run.sh /app/bin/hmcl
      - install -Dm644 io.github.theoninesixy.FlatHMCL.desktop /app/share/applications/io.github.theoninesixy.FlatHMCL.desktop
      - install -Dm644 io.github.theoninesixy.FlatHMCL.metainfo.xml /app/share/metainfo/io.github.theoninesixy.FlatHMCL.metainfo.xml
      - install -Dm644 io.github.theoninesixy.FlatHMCL.png /app/share/icons/hicolor/256x256/apps/io.github.theoninesixy.FlatHMCL.png
    sources:
      - type: file
        path: run.sh
      - type: file
        path: io.github.theoninesixy.FlatHMCL.desktop
      - type: file
        path: io.github.theoninesixy.FlatHMCL.metainfo.xml
      - type: file
        path: io.github.theoninesixy.FlatHMCL.png